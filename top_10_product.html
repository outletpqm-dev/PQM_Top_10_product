<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>PQM Top 10 Product Showcase</title>

<!-- =====================================================
     EXPORT LIBRARIES
===================================================== -->

<!-- Excel Library -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- PDF Library -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

/* =====================================================
   ROOT
===================================================== */

:root{

    --bg:#f3f0ea;

    --surface:#ffffff;

    --surface-soft:#f8f6f1;

    --text:#171717;

    --muted:#88847c;

    --border:#e5e0d7;

    --gold:#b18a52;

    --gold-dark:#8d6937;

    --green:#3f8064;

    --yellow:#b78935;

    --red:#b95c59;

    --blue:#547aa3;

    --shadow:
        0 18px 50px rgba(48,42,32,.08);

    --shadow-hover:
        0 28px 70px rgba(48,42,32,.14);

}


/* =====================================================
   RESET
===================================================== */

*{

    box-sizing:border-box;

    margin:0;

    padding:0;

}


/* =====================================================
   BODY
===================================================== */

body{

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:

        radial-gradient(
            circle at 10% 0%,
            rgba(177,138,82,.10),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(255,255,255,.8),
            transparent 30%
        ),

        var(--bg);

    color:var(--text);

    min-height:100vh;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    padding:24px 45px;

    background:
        rgba(255,255,255,.78);

    backdrop-filter:
        blur(20px);

    border-bottom:
        1px solid rgba(0,0,0,.07);

    position:sticky;

    top:0;

    z-index:50;

}


.header-inner{

    max-width:1500px;

    margin:auto;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

}


.logo-area{

    display:flex;

    align-items:center;

    gap:14px;

}


.logo-img{
    width:46px;
    height:46px;

    object-fit:contain;

    display:block;
}


.logo-text h1{

    font-size:18px;

    font-weight:750;

    letter-spacing:-.5px;

}


.logo-text p{

    color:var(--muted);

    font-size:11px;

    margin-top:4px;

    letter-spacing:.5px;

}


/* =====================================================
   HEADER ACTIONS
===================================================== */

.header-actions{

    display:flex;

    align-items:center;

    gap:10px;

}


/* =====================================================
   BUTTON
===================================================== */

.btn{

    border:
        1px solid var(--border);

    background:#fff;

    color:#222;

    padding:11px 17px;

    border-radius:11px;

    cursor:pointer;

    font-weight:650;

    transition:.25s;

    white-space:nowrap;

}


.btn:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px rgba(0,0,0,.08);

}


.btn-primary{

    background:#171717;

    color:#fff;

    border-color:#171717;

}


.btn-primary:hover{

    background:#292929;

}


/* =====================================================
   MAIN
===================================================== */

.container{

    max-width:1500px;

    margin:auto;

    padding:45px 40px 70px;

}


/* =====================================================
   HERO
===================================================== */

.hero{

    display:flex;

    justify-content:space-between;

    align-items:flex-end;

    margin-bottom:35px;

}


.hero h2{

    font-size:40px;

    font-weight:750;

    letter-spacing:-1.8px;

}


.hero p{

    color:var(--muted);

    margin-top:9px;

    font-size:14px;

}


.date-box{

    color:var(--muted);

    font-size:13px;

}


/* =====================================================
   STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;

    margin-bottom:35px;

}


.stat-card{

    background:
        rgba(255,255,255,.75);

    border:
        1px solid rgba(0,0,0,.06);

    border-radius:20px;

    padding:22px;

    box-shadow:var(--shadow);

}


.stat-label{

    color:var(--muted);

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:1.2px;

}


.stat-value{

    margin-top:9px;

    font-size:30px;

    font-weight:750;

    letter-spacing:-1px;

}


.stat-sub{

    margin-top:6px;

    color:var(--muted);

    font-size:12px;

}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:22px;

}


.search{

    position:relative;

    width:350px;

}


.search input{

    width:100%;

    background:
        rgba(255,255,255,.8);

    border:
        1px solid var(--border);

    color:var(--text);

    padding:
        13px 15px 13px 43px;

    border-radius:12px;

    outline:none;

    transition:.2s;

}


.search input:focus{

    border-color:var(--gold);

    box-shadow:
        0 0 0 3px rgba(177,138,82,.1);

}


.search-icon{

    position:absolute;

    left:15px;

    top:50%;

    transform:
        translateY(-50%);

    color:#999;

}


/* =====================================================
   PRODUCT GRID
===================================================== */

.product-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:22px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

    position:relative;

    background:
        rgba(255,255,255,.9);

    border:
        1px solid rgba(0,0,0,.06);

    border-radius:24px;

    overflow:hidden;

    box-shadow:var(--shadow);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

}


.product-card:hover{

    transform:
        translateY(-7px);

    box-shadow:
        var(--shadow-hover);

}


/* =====================================================
   CARD TOP
===================================================== */

.card-top{

    position:relative;

    padding:
        18px 18px 0;

    display:flex;

    justify-content:space-between;

    align-items:center;

}


/* =====================================================
   RANK
===================================================== */

.rank{

    width:38px;

    height:38px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#f1eee7;

    color:#777;

    font-size:13px;

    font-weight:750;

}


.rank.top1{

    background:#171717;

    color:#fff;

}


.rank.top2{

    background:#ddd8ce;

    color:#333;

}


.rank.top3{

    background:#d9c2a5;

    color:#513a20;

}


/* =====================================================
   STATUS
===================================================== */

.status{

    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:
        7px 10px;

    border-radius:20px;

    font-size:10px;

    font-weight:750;

}


.status-dot{

    width:6px;

    height:6px;

    border-radius:50%;

}


.status.good{

    background:#edf5ef;

    color:var(--green);

}


.status.good .status-dot{

    background:var(--green);

}


.status.warning{

    background:#f8f2e5;

    color:var(--yellow);

}


.status.warning .status-dot{

    background:var(--yellow);

}


.status.bad{

    background:#f8eaea;

    color:var(--red);

}


.status.bad .status-dot{

    background:var(--red);

}


.status.over{

    background:#eaf1f8;

    color:var(--blue);

}


.status.over .status-dot{

    background:var(--blue);

}


/* =====================================================
   IMAGE AREA
===================================================== */

.image-area{

    height:245px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    position:relative;

}


.image-area::before{

    content:"";

    position:absolute;

    width:185px;

    height:185px;

    border-radius:50%;

    background:#f3f0e9;

}


.product-image{

    position:relative;

    z-index:2;

    width:190px;

    height:190px;

    object-fit:contain;

    border-radius:20px;

    transition:
        transform .35s ease;

    filter:
        drop-shadow(
            0 18px 18px rgba(0,0,0,.12)
        );

}


.product-card:hover .product-image{

    transform:
        scale(1.06)
        translateY(-4px);

}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{

    padding:
        0 20px 20px;

}


.product-name{

    font-size:17px;

    font-weight:750;

    letter-spacing:-.4px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.product-code{

    margin-top:5px;

    font-size:11px;

    color:var(--muted);

    letter-spacing:.5px;

}


/* =====================================================
   METRICS
===================================================== */

.metrics{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    margin-top:20px;

}


.metric{

    background:
        var(--surface-soft);

    border-radius:13px;

    padding:12px;

}


.metric-label{

    font-size:9px;

    color:var(--muted);

    text-transform:uppercase;

    letter-spacing:.8px;

}


.metric-value{

    margin-top:5px;

    font-size:17px;

    font-weight:750;

}


.metric-value span{

    font-size:10px;

    font-weight:500;

    color:var(--muted);

}


/* =====================================================
   SOLD INPUT
===================================================== */

.sales-input{

    width:90px;

    border:none;

    background:transparent;

    outline:none;

    font-size:17px;

    font-weight:750;

    color:#171717;

    padding:0;

}


.sales-input:focus{

    border-bottom:
        1px solid var(--gold);

}


/* =====================================================
   PROGRESS
===================================================== */

.progress-section{

    margin-top:18px;

}


.progress-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:8px;

}


.progress-label{

    font-size:10px;

    color:var(--muted);

    text-transform:uppercase;

    letter-spacing:.7px;

}


.progress-percent{

    font-size:12px;

    font-weight:750;

}


.progress{

    height:7px;

    background:#ebe7df;

    border-radius:20px;

    overflow:hidden;

}


.progress-bar{

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #a9824d,
            #c9a66b
        );

    transition:
        width .5s ease;

}


/* =====================================================
   CARD BOTTOM
===================================================== */

.card-bottom{

    margin-top:20px;

    padding-top:15px;

    border-top:
        1px solid #eeeae3;

    display:flex;

    justify-content:flex-end;

}


.card-number{

    font-size:10px;

    color:var(--muted);

    letter-spacing:.8px;

    text-transform:uppercase;

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    grid-column:
        1 / -1;

    text-align:center;

    padding:80px;

    color:var(--muted);

    background:#fff;

    border-radius:20px;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1250px){

    .product-grid{

        grid-template-columns:
            repeat(3,1fr);

    }

}


@media(max-width:950px){

    .product-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

    .hero h2{

        font-size:32px;

    }

}


@media(max-width:650px){

    .header{

        padding:18px 20px;

    }

    .header-inner{

        align-items:flex-start;

        flex-direction:column;

    }

    .header-actions{

        width:100%;

        display:grid;

        grid-template-columns:
            1fr 1fr;

    }

    .header-actions .btn{

        width:100%;

        padding:
            10px 8px;

        font-size:12px;

    }

    .container{

        padding:
            30px 18px 50px;

    }

    .hero{

        flex-direction:column;

        align-items:flex-start;

        gap:12px;

    }

    .stats{

        grid-template-columns:1fr;

    }

    .product-grid{

        grid-template-columns:1fr;

    }

    .search{

        width:100%;

    }

    .toolbar{

        display:block;

    }

    .image-area{

        height:280px;

    }

    .product-image{

        width:220px;

        height:220px;

    }

}


@media(min-width:1550px){

    .product-grid{

        grid-template-columns:
            repeat(4,1fr);

    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


<div class="header-inner">


    <div class="logo-area">

        <div class="logo">
            <img src="image/logo-responsive.png" alt="PQM Logo">
        </div>

        <div class="logo-text">

            <h1>
                Product Collection
            </h1>

            <p>
                TOP 10 PERFORMANCE
            </p>

        </div>

    </div>


    <!-- EXPORT BUTTONS -->

    <div class="header-actions">

        <button
            class="btn"
            onclick="exportExcel()"
        >
            📊 Export Excel
        </button>


        <button
            class="btn btn-primary"
            onclick="exportPDF()"
        >
            📄 Export PDF
        </button>

    </div>


</div>


</header>

<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


<!-- =================================================
     HERO
================================================= -->

<section class="hero">

    <div>

        <h2>
            PQM Top 10 Products
        </h2>

        <p>
            A premium overview of your product sales performance.
        </p>

    </div>


    <div class="date-box">

        <span id="currentDate"></span>

    </div>

</section>



<!-- =================================================

================================================= -->

<section class="stats">


    <div class="stat-card">

            Total Products
        </div>

        <div
            class="stat-value"
            id="totalProducts"
        >
            10
        </div>

        <div class="stat-sub">
            Fixed Top 10 products
        </div>

    </div>



    <div class="stat-card">

        <div class="stat-label">
            Total Target
        </div>

        <div
            class="stat-value"
            id="totalTarget"
        >
            RM 0.00
        </div>

        <div class="stat-sub">
            Total target
        </div>

    </div>



    <div class="stat-card">

        <div class="stat-label">
            Total Sold
        </div>

        <div
            class="stat-value"

        >
            RM 0.00
        </div>

        <div class="stat-sub">

        </div>

    </div>



    <div class="stat-card">

        <div class="stat-label">
            Overall Progress
        </div>

        <div
            class="stat-value"
            id="overallProgress"
        >
            0.00%
        </div>

        <div class="stat-sub">
            Total performance
        </div>

    </div>


</section>



<!-- =================================================
     SEARCH
================================================= -->

<div class="toolbar">

    <div class="search">

        <span class="search-icon">
            ⌕
        </span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search product..."
            oninput="renderProducts()"
        >

    </div>

</div>



<!-- =================================================
     PRODUCT GRID
================================================= -->

<section
    class="product-grid"
    id="productList"
></section>


</main>

<script>

/* =====================================================
   FIXED TOP 10 PRODUCTS
===================================================== */

const products = [

    {
        id:1,
        name:"NanOllagen",
        code:"955616010728",
        target:3650.00,
        sold:2551.00,
        image:"image/eysmy_955616010728_300x300.jpg"
    },


    {

        image:"image/eysmy_955616010829_300x300.jpg"
    },


    {
        id:3,
        name:"TigerMune",
        code:"955616010810",
        target:8500.00,
        sold:5502.00,
        image:"image/eysmy_955616010810_300x300.jpg"
    },


    {
        id:4,
        name:"Essence of American Ginseng",
        code:"955616010848",
        target:2400.00,
        sold:511.00,
        image:"image/eysmy_955616010848_1000x1000.jpg"
    },


    {
        id:5,
        name:"Essence of Cordyceps",
        code:"955616040039",
        target:2500.00,
        sold:733.00,
        image:"image/eysmy_955616040039-1_1000x1000.jpg"
    },


    {
        id:6,
        name:"Cordyceps Sinensis Mycelia",
        code:"955616030009",
        target:7250.00,
        sold:2079.00,
        image:"image/eysmy_955616030009_Capsules-of-Cordyceps-Sinensis-Mycelia_300x300.jpg"
    },


    {
        id:7,
        name:"Sleep EZ",
        code:"955616040023",
        target:3750.00,
        sold:1400.00,
        image:"image/eysmy_955616040023_300x300.jpg"
    },


    {
        id:8,
        name:"Lingzhi Cracked Spores Plus Capsules",
        code:"955764734526",
        target:3850.00,
        sold:1278.00,
        image:"image/eysmy_955764734526_ling-zhi-cracked-spores-capsules-plus_300x300.jpg"
    },


    {
        id:9,
        name:"Men Vitality Capsule",
        code:"955764734540",
        target:8600.00,
        sold:1281.00,
        image:"image/eysmy_955764734540_300x300.jpg"
    },


    {
        id:10,
        name:"Prosta Men Capsule",
        code:"955764734542",
        target:3500.00,
        sold:1978.00,
        image:"image/eysmy_955764734542_300x300.jpg"
    }

];



/* =====================================================
   PERCENTAGE
===================================================== */

function getPercentage(
    sold,
    target
){

    if(
        !target ||
        target <= 0
    ){

        return 0;

    }


    return (
        sold / target
    ) * 100;

}



/* =====================================================
   STATUS
===================================================== */

function getStatus(
    percent
){

    if(
        percent >= 100
    ){

        return {

            class:"over",

            text:"Target Reached"

        };

    }


    if(
        percent >= 70
    ){

        return {

            class:"good",

            text:"On Track"

        };

    }


    if(
        percent >= 40
    ){

        return {

            class:"warning",

            text:"Needs Push"

        };

    }


    return {

        class:"bad",

        text:"Behind"

    };

}



/* =====================================================
   SORT PRODUCTS
===================================================== */

function getSortedProducts(){

    return [

        ...products

    ].sort(
        (a,b) => {

            return (

                getPercentage(
                    b.sold,
                    b.target
                )

                -

                getPercentage(
                    a.sold,
                    a.target
                )

            );

        }
    );

}



/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const list =
        document.getElementById(
            "productList"
        );


    const keyword =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    let filtered =
        products.filter(
            product => {

                return (

                    product.name
                    .toLowerCase()
                    .includes(keyword)

                    ||

                    product.code
                    .toLowerCase()
                    .includes(keyword)

                );

            }
        );


    /*
        排名根据销售完成率
    */

    filtered.sort(
        (a,b) => {

            return (

                getPercentage(
                    b.sold,
                    b.target
                )

                -

                getPercentage(
                    a.sold,
                    a.target
                )

            );

        }
    );


    if(
        filtered.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                No products found.

            </div>

        `;

        updateStats();

        return;

    }


    list.innerHTML =

        filtered
        .map(
            (product,index) => {


                const percent =
                    getPercentage(
                        product.sold,
                        product.target
                    );


                const status =
                    getStatus(
                        percent
                    );


                let rankClass = "";


                if(
                    index === 0
                ){

                    rankClass =
                        "top1";

                }


                if(
                    index === 1
                ){

                    rankClass =
                        "top2";

                }


                if(
                    index === 2
                ){

                    rankClass =
                        "top3";

                }


                let rankDisplay;


                if(
                    index === 0
                ){

                    rankDisplay = "🥇";

                }
                else if(
                    index === 1
                ){

                    rankDisplay = "🥈";

                }
                else if(
                    index === 2
                ){

                    rankDisplay = "🥉";

                }
                else{

                    rankDisplay =
                        "#" +
                        (index + 1);

                }


                return `

                    <article
                        class="product-card"
                    >


                        <div
                            class="card-top"
                        >

                            <div
                                class="
                                    rank
                                    ${rankClass}
                                "
                            >
                                ${rankDisplay}
                            </div>


                            <div
                                class="
                                    status
                                    ${status.class}
                                "
                            >

                                <span
                                    class="status-dot"
                                ></span>

                                ${status.text}

                            </div>

                        </div>



                        <div
                            class="image-area"
                        >

                            <img
                                class="product-image"
                                src="${product.image}"
                                alt="${product.name}"
                                onerror="this.style.opacity='0.3'"
                            >

                        </div>



                        <div
                            class="product-info"
                        >


                            <div
                                class="product-name"
                                title="${product.name}"
                            >
                                ${product.name}
                            </div>


                            <div
                                class="product-code"
                            >
                                ${product.code}
                            </div>



                            <div
                                class="metrics"
                            >


                                <div
                                    class="metric"
                                >

                                    <div
                                        class="metric-label"
                                    >
                                        Target
                                    </div>


                                    <div
                                        class="metric-value"
                                    >

                                        RM
                                        ${Number(
                                            product.target
                                        ).toFixed(2)}

                                    </div>

                                </div>



                                <div
                                    class="metric"
                                >

                                    <div
                                        class="metric-label"
                                    >
                                        Sold
                                    </div>


                                    <div
                                        class="metric-value"
                                    >

                                        <input
                                            class="sales-input"
                                            type="number"
                                            min="0"
                                            step="0.01"
                                            value="${Number(
                                                product.sold
                                            ).toFixed(2)}"
                                            onchange="
                                                updateSold(
                                                    ${product.id},
                                                    this.value
                                                )
                                            "
                                        >

                                        <span>
                                            RM
                                        </span>

                                    </div>

                                </div>


                            </div>



                            <div
                                class="progress-section"
                            >


                                <div
                                    class="progress-header"
                                >

                                    <span
                                        class="progress-label"
                                    >
                                        Performance
                                    </span>


                                    <span
                                        class="progress-percent"
                                    >
                                        ${percent.toFixed(2)}%
                                    </span>

                                </div>


                                <div
                                    class="progress"
                                >

                                    <div
                                        class="progress-bar"
                                        style="
                                            width:${Math.min(
                                                percent,
                                                100
                                            )}%
                                        "
                                    ></div>

                                </div>


                            </div>



                            <div
                                class="card-bottom"
                            >

                                <div
                                    class="card-number"
                                >
                                    PRODUCT
                                    ${String(
                                        product.id
                                    ).padStart(2,"0")}
                                </div>

                            </div>


                        </div>


                    </article>

                `;

            }
        )
        .join("");


    updateStats();

}



/* =====================================================
   UPDATE SOLD
===================================================== */

function updateSold(
    id,
    value
){

    const product =
        products.find(
            p =>
                p.id === id
        );


    if(
        !product
    ){

        return;

    }


    const newValue =
        Number(value);


    if(
        Number.isNaN(
            newValue
        )
        ||
        newValue < 0
    ){

        renderProducts();

        return;

    }


    product.sold =
        newValue;


    renderProducts();

}



/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

    const totalProducts =
        products.length;


    const totalTarget =
        products.reduce(
            (
                sum,
                product
            ) =>

                sum +
                Number(
                    product.target
                ),

            0
        );


    const totalSold =
        products.reduce(
            (
                sum,
                product
            ) =>

                sum +
                Number(
                    product.sold
                ),

            0
        );


    const overall =
        totalTarget > 0

        ?

        (
            totalSold /
            totalTarget
        ) * 100

        :

        0;


    document
        .getElementById(
            "totalProducts"
        )
        .textContent =
        totalProducts;


    document
        .getElementById(
            "totalTarget"
        )
        .textContent =
        "RM " +
        totalTarget.toFixed(2);


    document
        .getElementById(
            "totalSold"
        )
        .textContent =
        "RM " +
        totalSold.toFixed(2);


    document
        .getElementById(
            "overallProgress"
        )
        .textContent =
        overall.toFixed(2) +
        "%";

}



/* =====================================================
   RESET
===================================================== */

function resetData(){

    renderProducts();

}



/* =====================================================
   DATE
===================================================== */

function showDate(){

    const date =
        new Date();


    const formatted =
        date.toLocaleDateString(
            "en-MY",
            {

                year:"numeric",

                month:"long",

                day:"numeric"

            }
        );


    document
        .getElementById(
            "currentDate"
        )
        .textContent =
        formatted;

}



/* =====================================================
   EXPORT EXCEL
===================================================== */

function exportExcel(){

    if(
        typeof XLSX ===
        "undefined"
    ){

        alert(
            "Excel library failed to load. Please check your internet connection."
        );

        return;

    }


    /*
        Sort by performance
    */

    const sortedProducts =
        getSortedProducts();


    /*
        Excel data
    */

    const excelData =
        sortedProducts.map(
            (
                product,
                index
            ) => {


                const percent =
                    getPercentage(
                        product.sold,
                        product.target
                    );


                const status =
                    getStatus(
                        percent
                    );


                return {

                    "Rank":
                        index + 1,

                    "Product Name":
                        product.name,

                    "Product Code":
                        product.code,

                    "Target (RM)":
                        Number(
                            product.target
                        ),

                    "Sold (RM)":
                        Number(
                            product.sold
                        ),

                    "Performance (%)":
                        Number(
                            percent.toFixed(2)
                        ),

                    "Status":
                        status.text

                };

            }
        );


    /*
        Create worksheet
    */

    const worksheet =
        XLSX.utils.json_to_sheet(
            excelData
        );


    /*
        Column widths
    */

    worksheet["!cols"] = [

        {
            wch:8
        },

        {
            wch:35
        },

        {
            wch:18
        },

        {
            wch:16
        },

        {
            wch:16
        },

        {
            wch:20
        },

        {
            wch:20
        }

    ];


    /*
        Format Excel cells
    */

    for(
        let row = 2;

        row <=
        excelData.length + 1;

        row++
    ){

        if(
            worksheet[
                `D${row}`
            ]
        ){

            worksheet[
                `D${row}`
            ].z =
                'RM #,##0.00';

        }


        if(
            worksheet[
                `E${row}`
            ]
        ){

            worksheet[
                `E${row}`
            ].z =
                'RM #,##0.00';

        }


        if(
            worksheet[
                `F${row}`
            ]
        ){

            worksheet[
                `F${row}`
            ].z =
                '0.00';

        }

    }


    /*
        Create workbook
    */

    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(

        workbook,

        worksheet,

        "Top 10 Products"

    );


    /*
        Date
    */

    const date =
        new Date()
        .toISOString()
        .slice(
            0,
            10
        );


    /*
        Download
    */

    XLSX.writeFile(

        workbook,

        `PQM_Top_10_Products_${date}.xlsx`

    );

}



/* =====================================================
   EXPORT PDF
===================================================== */

function exportPDF(){

    if(
        typeof window.jspdf ===
        "undefined"
    ){

        alert(
            "PDF library failed to load. Please check your internet connection."
        );

        return;

    }


    const {
        jsPDF
    } =
        window.jspdf;


    /*
        Create A4 Landscape
    */

    const doc =
        new jsPDF({

            orientation:
                "landscape",

            unit:
                "mm",

            format:
                "a4"

        });


    /*
        Products
    */

    const sortedProducts =
        getSortedProducts();


    /*
        Date
    */

    const today =
        new Date();


    const date =
        today.toLocaleDateString(
            "en-MY",
            {

                year:"numeric",

                month:"long",

                day:"numeric"

            }
        );


    /*
        Total
    */

    const totalTarget =
        products.reduce(
            (
                sum,
                product
            ) =>

                sum +
                Number(
                    product.target
                ),

            0
        );


    const totalSold =
        products.reduce(
            (
                sum,
                product
            ) =>

                sum +
                Number(
                    product.sold
                ),

            0
        );


    const overall =
        totalTarget > 0

        ?

        (
            totalSold /
            totalTarget
        ) * 100

        :

        0;


    /*
        Title
    */

    doc.setFontSize(
        20
    );


    doc.setFont(
        "helvetica",
        "bold"
    );


    doc.text(
        "PQM Top 10 Products",
        14,
        15
    );


    /*
        Subtitle
    */

    doc.setFontSize(
        10
    );


    doc.setFont(
        "helvetica",
        "normal"
    );


    doc.text(
        "Product Sales Performance Report",
        14,
        22
    );


    doc.text(
        `Date: ${date}`,
        14,
        28
    );


    /*
        Summary
    */

    doc.text(
        `Total Target: RM ${totalTarget.toFixed(2)}`,
        180,
        20
    );


    doc.text(
        `Total Sold: RM ${totalSold.toFixed(2)}`,
        180,
        25
    );


    doc.text(
        `Overall Progress: ${overall.toFixed(2)}%`,
        180,
        30
    );


    /*
        Table
    */

    const tableData =
        sortedProducts.map(
            (
                product,
                index
            ) => {


                const percent =
                    getPercentage(
                        product.sold,
                        product.target
                    );


                const status =
                    getStatus(
                        percent
                    );


                return [

                    index + 1,

                    product.name,

                    product.code,

                    `RM ${Number(
                        product.target
                    ).toFixed(2)}`,

                    `RM ${Number(
                        product.sold
                    ).toFixed(2)}`,

                    `${percent.toFixed(2)}%`,

                    status.text

                ];

            }
        );


    /*
        Auto Table
    */

    doc.autoTable({

        startY:36,

        head:[

            [

                "Rank",

                "Product Name",

                "Product Code",

                "Target (RM)",

                "Sold (RM)",

                "Performance",

                "Status"

            ]

        ],

        body:
            tableData,

        theme:
            "grid",

        styles:{

            font:
                "helvetica",

            fontSize:
                8,

            cellPadding:
                3,

            valign:
                "middle"

        },

        headStyles:{

            fontStyle:
                "bold",

            halign:
                "center"

        },

        columnStyles:{

            0:{

                halign:
                    "center",

                cellWidth:
                    15

            },

            1:{

                cellWidth:
                    65

            },

            2:{

                cellWidth:
                    35

            },

            3:{

                halign:
                    "right",

                cellWidth:
                    32

            },

            4:{

                halign:
                    "right",

                cellWidth:
                    32

            },

            5:{

                halign:
                    "center",

                cellWidth:
                    28

            },

            6:{

                halign:
                    "center",

                cellWidth:
                    35

            }

        }

    });


    /*
        Footer
    */

    const pageCount =
        doc.internal
            .getNumberOfPages();


    for(
        let i = 1;

        i <= pageCount;

        i++
    ){

        doc.setPage(
            i
        );


        doc.setFontSize(
            8
        );


        doc.setFont(
            "helvetica",
            "normal"
        );


        doc.text(

            `PQM Top 10 Products | Page ${i} of ${pageCount}`,

            14,

            200

        );

    }


    /*
        Download
    */

    const fileDate =
        new Date()
        .toISOString()
        .slice(
            0,
            10
        );


    doc.save(

        `PQM_Top_10_Products_${fileDate}.pdf`

    );

}
